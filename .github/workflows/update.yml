name: MuleSoft Docs Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      success: ${{ steps.fetch.outputs.success }}
      fail: ${{ steps.fetch.outputs.fail }}
      count: ${{ steps.fetch.outputs.count }}
      cached: ${{ steps.fetch.outputs.cached }}
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and reorganize MuleSoft docs
        id: fetch
        shell: bash
        run: |
          set +e

          MAX_PARALLEL=5
          TMP=$(mktemp -d)
          REPO_BASE="https://siddharthsg2.github.io/mulesoft-docs/products"

          curl_with_retry() {
            local url="$1" output="$2" max_time="${3:-60}"
            local attempt=0 delay=2 http_code="000"
            while [ $attempt -lt 3 ]; do
              http_code=$(curl -sL -o "$output" -w "%{http_code}" "$url" --max-time "$max_time" || echo "000")
              if [ "$http_code" = "200" ] && [ -s "$output" ]; then
                echo "$http_code"; return 0
              fi
              attempt=$((attempt + 1))
              if [ $attempt -lt 3 ]; then
                echo "  Retry $attempt/3 in ${delay}s (HTTP $http_code)" >&2
                sleep $delay
                delay=$((delay * 2))
              fi
            done
            echo "000"; return 1
          }

          curl -sL -o llms_raw.txt "https://docs.mulesoft.com/llms.txt" 2>/dev/null || true

          if [ ! -s llms_raw.txt ]; then
            echo "ERROR: Failed to download root llms.txt"
            exit 1
          fi

          PRODUCTS=$(grep -oP 'https://docs\.mulesoft\.com/\K[^/]+(?=/llms\.txt)' llms_raw.txt 2>/dev/null | sort -u || echo "")

          {
            echo "# MuleSoft Documentation"
            echo ""
            echo "> Updated $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')"
            echo "> LLM-friendly index of all MuleSoft product documentation."
            echo ""
            echo "## Guides"
            echo ""
          } > llms.txt

          {
            echo "# MuleSoft Docs Sync Report"
            echo ""
            echo "| # | Product | Status | HTTP | Size |"
            echo "|---|---------|--------|------|------|"
          } > "$GITHUB_STEP_SUMMARY"

          echo "Phase 1: Checking remote indexes..."
          RUNNING=0
          for SLUG in $PRODUCTS; do
            mkdir -p "products/$SLUG" 2>/dev/null || true
            curl -sL "https://docs.mulesoft.com/$SLUG/llms.txt" --max-time 15 -o "$TMP/$SLUG.remote" 2>/dev/null || true
            ((RUNNING++))
            if [ $((RUNNING % 20)) -eq 0 ]; then
              echo "  Checked $RUNNING indexes..."
              wait
            fi
          done
          wait

          echo "Phase 2: Identifying products to update..."
          NEEDS_UPDATE=""
          COUNT=0
          CACHED=0
          for SLUG in $PRODUCTS; do
            COUNT=$((COUNT + 1))
            REMOTE_HASH=$(md5sum "$TMP/$SLUG.remote" 2>/dev/null | cut -d' ' -f1 || echo "")
            LOCAL_HASH=$(md5sum "products/$SLUG/llms.txt" 2>/dev/null | cut -d' ' -f1 || echo "")
            if [ -f "products/$SLUG/llms-full.txt" ] && [ -n "$REMOTE_HASH" ] && [ "$REMOTE_HASH" = "$LOCAL_HASH" ]; then
              CACHED=$((CACHED + 1))
            else
              NEEDS_UPDATE="$NEEDS_UPDATE $SLUG"
            fi
          done
          echo "  $CACHED cached, $(echo $NEEDS_UPDATE | wc -w 2>/dev/null || echo 0) to download"

          echo "Phase 3: Downloading docs in parallel (max $MAX_PARALLEL)..."
          RUNNING=0
          SUCCESS=0
          FAIL=0
          for SLUG in $NEEDS_UPDATE; do
            (
              HTTP_CODE=$(curl_with_retry "https://docs.mulesoft.com/$SLUG/llms-full.txt" "products/$SLUG/llms-full.txt" 60 || echo "000")
              if [ "$HTTP_CODE" = "200" ] && [ -s "products/$SLUG/llms-full.txt" ] && ! grep -qi "page not found" "products/$SLUG/llms-full.txt" 2>/dev/null; then
                cp "$TMP/$SLUG.remote" "products/$SLUG/llms.txt"
                sed -i "s|https://docs.mulesoft.com/$SLUG/llms-full.txt|$REPO_BASE/$SLUG/llms-full.txt|g" "products/$SLUG/llms.txt"
                echo "OK:$HTTP_CODE" > "$TMP/$SLUG.result"
              else
                rm -f "products/$SLUG/llms-full.txt"
                echo "FAIL:$HTTP_CODE" > "$TMP/$SLUG.result"
              fi
            ) &
            ((RUNNING++))
            if [ $RUNNING -ge $MAX_PARALLEL ]; then
              wait -n || true
              ((RUNNING--))
            fi
          done
          wait || true

          echo "Phase 4: Aggregating results..."
          IDX=0
          for SLUG in $PRODUCTS; do
            IDX=$((IDX + 1))
            DESC=$(grep -oP "(?<=$SLUG/llms\.txt\): )[^)]*" llms_raw.txt 2>/dev/null | head -1 || echo "")
            RESULT=$(cat "$TMP/$SLUG.result" 2>/dev/null || echo "")
            STATUS="${RESULT%%:*}"
            HTTP_CODE="${RESULT##*:}"

            if [ "$STATUS" = "OK" ]; then
              SUCCESS=$((SUCCESS + 1))
              SIZE=$(wc -c < "products/$SLUG/llms-full.txt" 2>/dev/null | tr -d ' ' || echo "0")
              echo "| $IDX | \`$SLUG\` | OK | $HTTP_CODE | ${SIZE}B |" >> "$GITHUB_STEP_SUMMARY"
            elif [ -f "products/$SLUG/llms-full.txt" ]; then
              SIZE=$(wc -c < "products/$SLUG/llms-full.txt" 2>/dev/null | tr -d ' ' || echo "0")
              echo "| $IDX | \`$SLUG\` | OK (cached) | - | ${SIZE}B |" >> "$GITHUB_STEP_SUMMARY"
            else
              FAIL=$((FAIL + 1))
              echo "| $IDX | \`$SLUG\` | Failed | $HTTP_CODE | - |" >> "$GITHUB_STEP_SUMMARY"
              rmdir "products/$SLUG" 2>/dev/null || true
            fi

            echo "- [$SLUG](https://siddharthsg2.github.io/mulesoft-docs/products/$SLUG/llms.txt): $DESC" >> llms.txt
          done

          {
            echo ""
            echo "**Success:** $SUCCESS | **Failed:** $FAIL | **Cached:** $CACHED | **Total:** $COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "fail=$FAIL" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "cached=$CACHED" >> $GITHUB_OUTPUT

          echo "" >> llms.txt
          echo "Success: $SUCCESS | Failed: $FAIL | Cached: $CACHED | Total: $COUNT" >> llms.txt

          rm -rf "$TMP"

      - name: Scrub false-positive secrets
        shell: bash
        run: |
          set +e
          SCRUBBED=0
          for f in products/*/llms-full.txt; do
            [ -f "$f" ] || continue
            BEFORE=$(wc -l < "$f")

            # Blank OAuth values inside XML attributes
            sed -i -E 's/(consumerKey=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(consumerSecret=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(client_id=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(client_secret=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(clientKey=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(clientKeySecret=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(apiKey=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(api_key=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(secretKey=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(secret_key=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(accessToken=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(access_token=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(refreshToken=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true
            sed -i -E 's/(refresh_token=")[^"]*"/\1REDACTED"/g' "$f" 2>/dev/null || true

            # Google OAuth patterns
            sed -i '/apps\.googleusercontent\.com/d' "$f" 2>/dev/null || true
            sed -i '/GOCSPX-/d' "$f" 2>/dev/null || true
            sed -i '/AIza[A-Za-z0-9_-]\{35\}/d' "$f" 2>/dev/null || true

            # Azure AD / Microsoft patterns
            sed -i '/P8M8Q~/d' "$f" 2>/dev/null || true
            sed -i '/[0-9a-f]\{8\}-[0-9a-f]\{4\}-[0-9a-f]\{4\}-[0-9a-f]\{4\}-[0-9a-f]\{12\}\/oauth2\/v2\.0/d' "$f" 2>/dev/null || true
            sed -i '/[0-9a-f]\{8\}-[0-9a-f]\{4\}-[0-9a-f]\{4\}-[0-9a-f]\{4\}-[0-9a-f]\{12\}\/oauth\/v2\.0/d' "$f" 2>/dev/null || true

            # AWS patterns
            sed -i '/AKIA[A-Z0-9]\{16\}/d' "$f" 2>/dev/null || true
            sed -i '/AKIA[A-Z0-9]\{12\}/d' "$f" 2>/dev/null || true
            sed -i '/ASIA[A-Z0-9]\{16\}/d' "$f" 2>/dev/null || true

            # Generic standalone secret lines (only at line start with key=value format)
            sed -i -E '/^\s*(client_id|client_secret|clientid|clientsecret|api_key|apikey|secret_key|secretkey|access_token|accesstoken|refresh_token|refreshtoken)\s*[:=]/Id' "$f" 2>/dev/null || true
            sed -i -E '/^\s*sk-[A-Za-z0-9]{20,}\s*$/d' "$f" 2>/dev/null || true
            sed -i -E '/^\s*ghp_[A-Za-z0-9]{36}\s*$/d' "$f" 2>/dev/null || true
            sed -i -E '/^\s*gho_[A-Za-z0-9]{36}\s*$/d' "$f" 2>/dev/null || true

            # More GitHub PAT patterns
            sed -i -E '/^\s*github_pat_[A-Za-z0-9_]{22,}\s*$/d' "$f" 2>/dev/null || true
            sed -i -E '/^\s*ghr_[A-Za-z0-9_]{36,}\s*$/d' "$f" 2>/dev/null || true

            # Slack tokens
            sed -i -E '/^\s*xox[baprs]-[A-Za-z0-9-]+\s*$/d' "$f" 2>/dev/null || true

            # Stripe keys
            sed -i -E '/^\s*sk_live_[A-Za-z0-9]{24,}\s*$/d' "$f" 2>/dev/null || true
            sed -i -E '/^\s*pk_live_[A-Za-z0-9]{24,}\s*$/d' "$f" 2>/dev/null || true

            # Twilio
            sed -i -E '/^\s*SK[0-9a-f]{32}\s*$/d' "$f" 2>/dev/null || true

            # Private keys
            sed -i '/BEGIN.*PRIVATE KEY/d' "$f" 2>/dev/null || true

            AFTER=$(wc -l < "$f")
            REMOVED=$((BEFORE - AFTER))
            if [ $REMOVED -gt 0 ]; then
              echo "  $f: removed $REMOVED lines"
              SCRUBBED=$((SCRUBBED + REMOVED))
            fi
          done
          echo "Scrubbed $SCRUBBED lines across all files"

      - name: Check for changes
        id: check-changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
          fi

      - name: Commit changes back to repo
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update MuleSoft docs (${{ steps.fetch.outputs.success }} updated, ${{ steps.fetch.outputs.cached }} cached)"
          git push

      - name: Setup Pages
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    runs-on: ubuntu-latest
    needs: fetch-docs
    if: needs.fetch-docs.outputs.has_changes == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
