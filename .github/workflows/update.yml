name: MuleSoft Docs Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      success: ${{ steps.fetch.outputs.success }}
      fail: ${{ steps.fetch.outputs.fail }}
      count: ${{ steps.fetch.outputs.count }}
      cached: ${{ steps.fetch.outputs.cached }}
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and reorganize MuleSoft docs
        id: fetch
        shell: bash
        run: |
          set +e

          MAX_PARALLEL=5
          TMP=$(mktemp -d)
          REPO_BASE="https://siddharthsg2.github.io/mulesoft-docs/products"

          curl_with_retry() {
            local url="$1" output="$2" max_time="${3:-60}"
            local attempt=0 delay=2 http_code="000"
            while [ $attempt -lt 3 ]; do
              http_code=$(curl -sL -o "$output" -w "%{http_code}" "$url" --max-time "$max_time" || echo "000")
              if [ "$http_code" = "200" ] && [ -s "$output" ]; then
                echo "$http_code"; return 0
              fi
              attempt=$((attempt + 1))
              if [ $attempt -lt 3 ]; then
                echo "  Retry $attempt/3 in ${delay}s (HTTP $http_code)" >&2
                sleep $delay
                delay=$((delay * 2))
              fi
            done
            echo "000"; return 1
          }

          curl -sL -o llms_raw.txt "https://docs.mulesoft.com/llms.txt" || true

          if [ ! -s llms_raw.txt ]; then
            echo "ERROR: Failed to download root llms.txt"
            exit 1
          fi

          PRODUCTS=$(grep -oP 'https://docs\.mulesoft\.com/\K[^/]+(?=/llms\.txt)' llms_raw.txt | sort -u)

          {
            echo "# MuleSoft Documentation"
            echo ""
            echo "> Updated $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')"
            echo "> LLM-friendly index of all MuleSoft product documentation."
            echo ""
            echo "## Guides"
            echo ""
          } > llms.txt

          {
            echo "# MuleSoft Docs Sync Report"
            echo ""
            echo "| # | Product | Status | HTTP | Size |"
            echo "|---|---------|--------|------|------|"
          } > "$GITHUB_STEP_SUMMARY"

          echo "Phase 1: Checking remote indexes..."
          RUNNING=0
          for SLUG in $PRODUCTS; do
            mkdir -p "products/$SLUG"
            curl -sL "https://docs.mulesoft.com/$SLUG/llms.txt" --max-time 15 -o "$TMP/$SLUG.remote" || true
            ((RUNNING++))
            if [ $((RUNNING % 20)) -eq 0 ]; then
              echo "  Checked $RUNNING indexes..."
              wait
            fi
          done
          wait

          echo "Phase 2: Identifying products to update..."
          NEEDS_UPDATE=""
          COUNT=0
          CACHED=0
          for SLUG in $PRODUCTS; do
            COUNT=$((COUNT + 1))
            REMOTE_HASH=$(md5sum "$TMP/$SLUG.remote" 2>/dev/null | cut -d' ' -f1)
            LOCAL_HASH=$(md5sum "products/$SLUG/llms.txt" 2>/dev/null | cut -d' ' -f1)
            if [ -f "products/$SLUG/llms-full.txt" ] && [ "$REMOTE_HASH" = "$LOCAL_HASH" ]; then
              CACHED=$((CACHED + 1))
            else
              NEEDS_UPDATE="$NEEDS_UPDATE $SLUG"
            fi
          done
          echo "  $CACHED cached, $(echo $NEEDS_UPDATE | wc -w) to download"

          echo "Phase 3: Downloading docs in parallel (max $MAX_PARALLEL)..."
          RUNNING=0
          SUCCESS=0
          FAIL=0
          for SLUG in $NEEDS_UPDATE; do
            (
              HTTP_CODE=$(curl_with_retry "https://docs.mulesoft.com/$SLUG/llms-full.txt" "products/$SLUG/llms-full.txt" 60 || echo "000")
              if [ "$HTTP_CODE" = "200" ] && [ -s "products/$SLUG/llms-full.txt" ] && ! grep -qi "page not found" "products/$SLUG/llms-full.txt" 2>/dev/null; then
                cp "$TMP/$SLUG.remote" "products/$SLUG/llms.txt"
                sed -i "s|https://docs.mulesoft.com/$SLUG/llms-full.txt|$REPO_BASE/$SLUG/llms-full.txt|g" "products/$SLUG/llms.txt"
                echo "OK:$HTTP_CODE" > "$TMP/$SLUG.result"
              else
                rm -f "products/$SLUG/llms-full.txt"
                echo "FAIL:$HTTP_CODE" > "$TMP/$SLUG.result"
              fi
            ) &
            ((RUNNING++))
            if [ $RUNNING -ge $MAX_PARALLEL ]; then
              wait -n
              ((RUNNING--))
            fi
          done
          wait

          echo "Phase 4: Aggregating results..."
          IDX=0
          for SLUG in $PRODUCTS; do
            IDX=$((IDX + 1))
            DESC=$(grep -oP "(?<=$SLUG/llms\.txt\): )[^)]*" llms_raw.txt | head -1)
            RESULT=$(cat "$TMP/$SLUG.result" 2>/dev/null || echo "")
            STATUS="${RESULT%%:*}"
            HTTP_CODE="${RESULT##*:}"

            if [ "$STATUS" = "OK" ]; then
              SUCCESS=$((SUCCESS + 1))
              SIZE=$(wc -c < "products/$SLUG/llms-full.txt" | tr -d ' ')
              echo "| $IDX | \`$SLUG\` | OK | $HTTP_CODE | ${SIZE}B |" >> "$GITHUB_STEP_SUMMARY"
            elif [ -f "products/$SLUG/llms-full.txt" ]; then
              SIZE=$(wc -c < "products/$SLUG/llms-full.txt" | tr -d ' ')
              echo "| $IDX | \`$SLUG\` | OK (cached) | - | ${SIZE}B |" >> "$GITHUB_STEP_SUMMARY"
            else
              FAIL=$((FAIL + 1))
              echo "| $IDX | \`$SLUG\` | Failed | $HTTP_CODE | - |" >> "$GITHUB_STEP_SUMMARY"
              rmdir "products/$SLUG" 2>/dev/null || true
            fi

            echo "- [$SLUG](https://siddharthsg2.github.io/mulesoft-docs/products/$SLUG/llms.txt): $DESC" >> llms.txt
          done

          {
            echo ""
            echo "**Success:** $SUCCESS | **Failed:** $FAIL | **Cached:** $CACHED | **Total:** $COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "fail=$FAIL" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "cached=$CACHED" >> $GITHUB_OUTPUT

          echo "" >> llms.txt
          echo "Success: $SUCCESS | Failed: $FAIL | Cached: $CACHED | Total: $COUNT" >> llms.txt

          rm -rf "$TMP"

      - name: Check for changes
        id: check-changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
          fi

      - name: Commit changes back to repo
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update MuleSoft docs (${{ steps.fetch.outputs.success }} updated, ${{ steps.fetch.outputs.cached }} cached)"
          git push

      - name: Setup Pages
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    runs-on: ubuntu-latest
    needs: fetch-docs
    if: needs.fetch-docs.outputs.has_changes == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
